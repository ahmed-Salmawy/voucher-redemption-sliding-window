spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vouchers
    username: vouchers
    password: vouchers
  jpa:
    hibernate:
      ddl-auto: validate   # schema comes from schema.sql so constraints are explicit
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379

voucher:
  rate-limit:
    max-redemptions: 5     # per user
    window: PT1H           # ISO-8601 duration
